<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14162b"/><stop offset="1" stop-color="#302650"/></linearGradient></defs><rect width="1440" height="650" rx="28" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="75" fill="#f2d184" font-size="36" font-weight="700">Из чего складывался результат</text><text x="64" y="115" fill="#bfb8d1" font-size="20">Подтверждённая история: конец октября — начало ноября 2026</text><path d="M100 197V574" stroke="#7764b4" stroke-width="4"/><circle cx="100" cy="202" r="9" fill="#f2d184"/><text x="135" y="209" fill="#bdafe4" font-size="18">31 ОКТЯБРЯ</text><text x="355" y="209" fill="#f6f3ff" font-size="25" font-weight="600">Проверяемая база</text><text x="355" y="240" fill="#bfb8d1" font-size="19">Эталонные файлы, исходные тесты, восстановление</text><circle cx="100" cy="289" r="9" fill="#f2d184"/><text x="135" y="296" fill="#bdafe4" font-size="18">1 НОЯБРЯ</text><text x="355" y="296" fill="#f6f3ff" font-size="25" font-weight="600">Повседневные функции</text><text x="355" y="327" fill="#bfb8d1" font-size="19">Общение, поиск, избранное и массовые действия</text><circle cx="100" cy="376" r="9" fill="#f2d184"/><text x="135" y="383" fill="#bdafe4" font-size="18">2–4 НОЯБРЯ</text><text x="355" y="383" fill="#f6f3ff" font-size="25" font-weight="600">Интерфейс и процессы</text><text x="355" y="414" fill="#bfb8d1" font-size="19">Royal Indigo, сессии, переходы, поручения</text><circle cx="100" cy="463" r="9" fill="#f2d184"/><text x="135" y="470" fill="#bdafe4" font-size="18">5 НОЯБРЯ</text><text x="355" y="470" fill="#f6f3ff" font-size="25" font-weight="600">Связность рабочего пространства</text><text x="355" y="501" fill="#bfb8d1" font-size="19">Личные диалоги, общий журнал и исправления</text><circle cx="100" cy="550" r="9" fill="#f2d184"/><text x="135" y="557" fill="#bdafe4" font-size="18">10 НОЯБРЯ</text><text x="355" y="557" fill="#f6f3ff" font-size="25" font-weight="600">Единая стабилизация</text><text x="355" y="588" fill="#bfb8d1" font-size="19">112 проверок, подписанная установка и восстановление</text><text x="64" y="622" fill="#aaa3be" font-size="17">РЕДАКЦИОННАЯ СХЕМА  ·  ДАТЫ ПО МОСКВЕ  ·  НЕ СКРИНШОТ</text></g></svg>