<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131629"/><stop offset="1" stop-color="#302550"/></linearGradient></defs><rect width="1440" height="420" rx="28" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="76" fill="#efd187" font-size="36" font-weight="700">Путь документа за одной кнопкой</text><text x="64" y="119" fill="#c7bfd7" font-size="22">Пользователь задаёт действие — система связывает доступ, передачу и результат</text><rect x="64" y="185" width="248" height="145" rx="18" fill="#35304f" stroke="#756299"/><text x="84" y="220" fill="#eacc83" font-size="18">01 · Клиент</text><text x="84" y="260" fill="#f4f0ff" font-size="22" font-weight="600">Выбрать файл</text><text x="84" y="300" fill="#bdb4ce" font-size="17">Материал и папка</text><path d="M317 257h10m-5-5 5 5-5 5" fill="none" stroke="#b6a0e4" stroke-width="2"/><rect x="330" y="185" width="248" height="145" rx="18" fill="#35304f" stroke="#756299"/><text x="350" y="220" fill="#eacc83" font-size="18">02 · Сервер</text><text x="350" y="260" fill="#f4f0ff" font-size="22" font-weight="600">Проверить доступ</text><text x="350" y="300" fill="#bdb4ce" font-size="17">Учётная запись и права</text><path d="M583 257h10m-5-5 5 5-5 5" fill="none" stroke="#b6a0e4" stroke-width="2"/><rect x="596" y="185" width="248" height="145" rx="18" fill="#35304f" stroke="#756299"/><text x="616" y="220" fill="#eacc83" font-size="18">03 · Сервер → хранилище</text><text x="616" y="260" fill="#f4f0ff" font-size="22" font-weight="600">Передать данные</text><text x="616" y="300" fill="#bdb4ce" font-size="17">Потоковая обработка</text><path d="M849 257h10m-5-5 5 5-5 5" fill="none" stroke="#b6a0e4" stroke-width="2"/><rect x="862" y="185" width="248" height="145" rx="18" fill="#35304f" stroke="#756299"/><text x="882" y="220" fill="#eacc83" font-size="18">04 · Система</text><text x="882" y="260" fill="#f4f0ff" font-size="22" font-weight="600">Сохранить результат</text><text x="882" y="300" fill="#bdb4ce" font-size="17">Содержимое и сведения</text><path d="M1115 257h10m-5-5 5 5-5 5" fill="none" stroke="#b6a0e4" stroke-width="2"/><rect x="1128" y="185" width="248" height="145" rx="18" fill="#35304f" stroke="#756299"/><text x="1148" y="220" fill="#eacc83" font-size="18">05 · Клиент</text><text x="1148" y="260" fill="#f4f0ff" font-size="22" font-weight="600">Обновить вид</text><text x="1148" y="300" fill="#bdb4ce" font-size="17">Список и события</text><text x="64" y="388" fill="#a99fbc" font-size="17">ОБОБЩЁННАЯ СХЕМА ПРОЦЕССА · НЕ СКРИНШОТ</text></g></svg>